<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Этикетки</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }

        .no-print {
            padding: 16px 24px;
            background: #fff;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .no-print button {
            padding: 8px 20px;
            background: #0d6efd;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        .no-print a {
            color: #6c757d;
            text-decoration: none;
            font-size: 14px;
        }
        .no-print span {
            color: #495057;
            font-size: 14px;
        }

        .labels-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 24px;
        }

        .label {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 180px;
            padding: 10px 8px 8px;
            text-align: center;
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .label-inv {
            font-size: 11px;
            color: #666;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .label-title {
            font-size: 10px;
            font-weight: bold;
            line-height: 1.3;
            margin-bottom: 4px;
            max-height: 2.6em;
            overflow: hidden;
        }

        .label svg {
            width: 100%;
            height: auto;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: #fff; }
            .labels-grid { padding: 4mm; gap: 4mm; }
            .label { border: 0.5pt solid #999; }
        }
    </style>
</head>
{% load i18n %}
<body>

<div class="no-print">
    <button onclick="window.print()">🖨 {% translate "Распечатать" %}</button>
    <a href="{% url 'catalog_admin:index' %}" id="btn-back">← {% translate "Назад" %}</a>
    <span>{% blocktranslate with n=books|length %}Этикеток: {{ n }}{% endblocktranslate %}</span>
</div>

<script>
// Страница открывается в новой вкладке (каталог остаётся открытым в исходной),
// поэтому history.back() тут не сработает — пробуем закрыть вкладку, а если
// браузер не даёт (например, если это не единственная страница в истории
// вкладки) — переходим в каталог как раньше.
var backBtn = document.getElementById('btn-back');
var backUrl = backBtn.href;
backBtn.addEventListener('click', function (e) {
    e.preventDefault();
    window.close();
    setTimeout(function () {
        window.location.href = backUrl;
    }, 300);
});
</script>

<div class="labels-grid">
    {% for book in books %}
    <div class="label">
        <div class="label-inv">{{ book.inventory_number }}</div>
        <div class="label-title">{{ book.title|truncatechars:50 }}</div>
        <svg id="barcode-{{ book.pk }}" class="barcode"></svg>
    </div>
    {% endfor %}
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    var books = [
        {% for book in books %}
        { id: {{ book.pk }}, value: "{{ book.inventory_number|escapejs }}" }{% if not forloop.last %},{% endif %}
        {% endfor %}
    ];
    books.forEach(function (b) {
        try {
            JsBarcode('#barcode-' + b.id, b.value, {
                format: 'CODE128',
                width: 1.4,
                height: 40,
                displayValue: true,
                fontSize: 10,
                margin: 4,
            });
        } catch (e) {
            document.getElementById('barcode-' + b.id).outerHTML =
                '<div style="color:red;font-size:10px">Ошибка штрих-кода</div>';
        }
    });
});
</script>
</body>
</html>
