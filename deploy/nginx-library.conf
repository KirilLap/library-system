server {
    listen 80;
    # Сейчас сайт открывается по IP. Когда появится домен, замените _ на: ваш-домен.uz www.ваш-домен.uz
    server_name _;

    client_max_body_size 20M;

    location /static/ {
        alias /opt/library-system/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /opt/library-system/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
